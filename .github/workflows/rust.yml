name: Legacy Rust prototype CI
on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - compiler/**
      - tools/cling/Cargo.toml
      - tools/cling/src/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - compiler/**
      - tools/cling/Cargo.toml
      - tools/cling/src/**
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - run: cargo run -p cling -- examples/hello.cling
      - run: cargo run -p cling -- --emit exe examples/control_flow.cling -o /tmp/cling-native-smoke
      - run: test "$( /tmp/cling-native-smoke | head -n 1 )" = "55"
      - name: native host executable smoke test
        run: cargo run -p cling -- --emit exe examples/hello.cling -o /tmp/cling-hello && /tmp/cling-hello
